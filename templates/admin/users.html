{% extends "admin/base.html" %} {% block content %}

<h2 class="mb-4">Registered Users</h2>

<div class="card shadow-sm">
  <div class="card-body">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Username</th>
          <th>User ID</th>
        </tr>
      </thead>

      <tbody>
        {% for user in users %}

        <tr>
          <td>{{ user.first_name }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.user_id }}</td>
        </tr>

        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

{% endblock %}
